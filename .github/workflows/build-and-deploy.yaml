name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

# 同一分支并发时自动取消上一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 统一权限（也可下沉到 job）
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  # ============================
  # dev 分支
  # ============================
  dev_pipeline:
    if: github.ref == 'refs/heads/dev'
    name: Dev Branch Pipeline
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (dev)
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-${{ github.sha }}

      - name: Build & Push (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          build-args: |
            APK_MIRROR_URL=https://mirrors.tuna.tsinghua.edu.cn

      - name: Remote Deploy Dev
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            IMAGE_REPO="${{ env.IMAGE_REPO }}"
            TAG="dev-${{ github.sha }}"

            # 如果 GHCR 包是私有的，需要先登录（可在 Secrets 配 GHCR_USER / GHCR_PAT 后解除注释）
            # echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            echo "Pulling ${IMAGE_REPO}:${TAG}"
            docker pull "${IMAGE_REPO}:${TAG}"

            echo "Cleanup old container and images..."
            docker rm -f digital-twin-dev || true
            docker images --format "{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedAt}}" \
              | grep "^${IMAGE_REPO}:dev-" \
              | awk 'NR>1 {print $1}' \
              | xargs -r docker rmi -f || true
            docker image prune --filter "dangling=true" -f || true

            echo "Run new container..."
            docker run --restart=always -d \
              -p 8092:80 \
              -p 9999:9999 \
              -p 5858:5858 \
              --name digital-twin-dev \
              -v /root/zdy/docker/log/digital-twin:/app/log \
              -e TAG="dev-server" \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e INIT_MODE="rebuild" \
              -e MQTT_BROKER_HOST="${{ secrets.MQTT_BROKER_HOST }}" \
              -e MQTT_BROKER_PORT="${{ secrets.MQTT_BROKER_PORT }}" \
              -e SSE_PING_INTERVAL="1" \
              "${IMAGE_REPO}:${TAG}"

  # ============================
  # master 分支
  # ============================
  master_pipeline:
    if: github.ref == 'refs/heads/main'
    name: Main Branch Pipeline
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (master)
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=main-latest
            type=raw,value=main-${{ github.sha }}

      - name: Build & Push (main)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}
          build-args: |
            APK_MIRROR_URL=https://mirrors.tuna.tsinghua.edu.cn

      - name: Remote Deploy Main
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            IMAGE_REPO="${{ env.IMAGE_REPO }}"
            TAG="main-${{ github.sha }}"

            # 如果 GHCR 包是私有的，需要先登录（可在 Secrets 配 GHCR_USER / GHCR_PAT 后解除注释）
            # echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            echo "Pulling ${IMAGE_REPO}:${TAG}"
            docker pull "${IMAGE_REPO}:${TAG}"

            echo "Cleanup old container and images..."
            docker rm -f digital-twin-main || true
            docker images --format "{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedAt}}" \
              | grep "^${IMAGE_REPO}:main-" \
              | awk 'NR>1 {print $1}' \
              | xargs -r docker rmi -f || true
            docker image prune --filter "dangling=true" -f || true

            echo "Run new container..."
            docker run --restart=always -d \
              -p 8092:80 \
              -p 5858:5858 \
              --name digital-twin-main \
              -v /root/zdy/docker/log/digital-twin:/app/log \
              -e TAG="稳定版服务" \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e INIT_MODE="rebuild" \
              -e MQTT_BROKER_HOST="${{ secrets.MQTT_BROKER_HOST }}" \
              -e MQTT_BROKER_PORT="${{ secrets.MQTT_BROKER_PORT }}" \
              -e SSE_PING_INTERVAL="1" \
              "${IMAGE_REPO}:${TAG}"
